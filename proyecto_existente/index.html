<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>Sistema Smartcorp</title>
    
    <!-- LIBRERÍAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* CSS ESPECIAL PARA QUE EL PDF NO SALGA AMONTONADO */
      @media print {
        @page { size: landscape; margin: 10mm; }
        body { background: white !important; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        
        .print-hidden { display: none !important; }
        
        /* Sistema de columnas Flexbox (Grid se amontona en PDF) */
        .print-row { 
          display: flex !important; 
          flex-direction: row !important; 
          flex-wrap: nowrap !important; 
          width: 100% !important; 
          gap: 20px !important; 
          margin-bottom: 20px !important; 
        }
        .print-col-2 { 
          flex: 1 !important; 
          width: calc(50% - 10px) !important; 
          box-sizing: border-box !important; 
        }
        
        /* Control de saltos de página */
        .print-avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; }
        .print-page-break { page-break-before: always !important; break-before: page !important; padding-top: 10px !important;}
        
        .print-no-shadow { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
        
        /* Altura controlada para los gráficos para que no colapsen */
        .recharts-responsive-container { width: 100% !important; }
        .print-chart-fixed { height: 250px !important; min-height: 250px !important; }
      }

      #loader {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: white; z-index: 50; display: flex;
        justify-content: center; align-items: center;
        flex-direction: column; color: #64748b;
      }
      .toast {
        position: fixed; bottom: 20px; right: 20px; z-index: 100;
        animation: slideIn 0.3s ease-out;
      }
      @keyframes slideIn {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      .processing { opacity: 0.7; cursor: not-allowed; }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="loader">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
      <p>Cargando sistema...</p>
    </div>
    <div id="root"></div>

    <script type="text/babel">
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if(loader) loader.style.display = 'none';
      }, 1500);

      const { useState, useMemo, useEffect, useRef, Component } = React;
      const { 
        BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, 
        Legend, ResponsiveContainer, Cell, ReferenceLine, LabelList, ComposedChart, Scatter,
        PieChart, Pie 
      } = window.Recharts;

      // --- ICONOS ---
      const Icon = ({ name, size = 20, className }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (!ref.current || !window.lucide) return;
          const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
          const iconDef = window.lucide.icons[pascalName] || window.lucide.icons[name];
          if (iconDef) {
             const svg = window.lucide.createElement(iconDef);
             svg.setAttribute('width', size);
             svg.setAttribute('height', size);
             if(className) svg.setAttribute('class', className);
             ref.current.innerHTML = '';
             ref.current.appendChild(svg);
          }
        }, [name, size, className]);
        return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
      };

      const Icons = {
        Calendar: (p) => <Icon name="calendar" {...p}/>,
        Download: (p) => <Icon name="download" {...p}/>,
        User: (p) => <Icon name="user" {...p}/>,
        Briefcase: (p) => <Icon name="briefcase" {...p}/>,
        CheckCircle: (p) => <Icon name="check-circle-2" {...p}/>,
        Clock: (p) => <Icon name="clock" {...p}/>,
        MapPin: (p) => <Icon name="map-pin" {...p}/>,
        TrendingUp: (p) => <Icon name="trending-up" {...p}/>,
        Award: (p) => <Icon name="award" {...p}/>,
        RefreshCw: (p) => <Icon name="refresh-cw" {...p}/>,
        Play: (p) => <Icon name="play" {...p}/>,
        Search: (p) => <Icon name="search" {...p}/>,
        Database: (p) => <Icon name="database" {...p}/>,
        Loader2: (p) => <Icon name="loader-2" {...p} className="animate-spin"/>,
        XCircle: (p) => <Icon name="x-circle" {...p}/>,
        ChevronDown: (p) => <Icon name="chevron-down" {...p}/>,
        FileText: (p) => <Icon name="file-text" {...p}/>,
        Copy: (p) => <Icon name="copy" {...p}/>,
        X: (p) => <Icon name="x" {...p}/>,
        ClipboardList: (p) => <Icon name="clipboard-list" {...p}/>,
        AlertTriangle: (p) => <Icon name="alert-triangle" {...p}/>,
        CheckSquare: (p) => <Icon name="check-square" {...p}/>,
        LayoutDashboard: (p) => <Icon name="layout-dashboard" {...p}/>,
        Image: (p) => <Icon name="image" {...p}/>,
      };

      // --- UTILS ---
      const timeToMinutes = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string' || timeStr === '00:00') return 0;
        try { const [h, m] = timeStr.split(':').map(Number); return (h||0)*60 + (m||0); } catch (e) { return 0; }
      };
      const minutesToTime = (total) => {
        if (!total && total !== 0) return '00:00';
        const h = Math.floor(total / 60); const m = Math.floor(total % 60); 
        return `${h.toString().padStart(2,'0')}:${Math.round(m).toString().padStart(2,'0')}`;
      };
      const timeToDecimal = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string' || timeStr === '00:00') return null;
        const [h, m] = timeStr.split(':').map(Number); return h + (m/60);
      };
      const decimalToTimeStr = (decimal) => {
        if (decimal === null || decimal === undefined) return '';
        const h = Math.floor(decimal); const m = Math.round((decimal - h) * 60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
      };
      const normalizeDate = (dateStr) => {
        if (!dateStr) return '';
        const cleanStr = String(dateStr).trim().split(' ')[0]; 
        if (/^\d{4}-\d{2}-\d{2}$/.test(cleanStr)) return cleanStr;
        const parts = cleanStr.split(/[\/\-]/);
        if (parts.length === 3) {
          let day = parts[0].padStart(2, '0'); let month = parts[1].padStart(2, '0'); let year = parts[2];
          if (day.length === 4) { year = day; day = parts[2].padStart(2, '0'); }
          return `${year}-${month}-${day}`;
        }
        return cleanStr; 
      };

      // --- LÓGICA PUNTUACION (25% / 25% / 40% / 10%) ---
      const calcSalida = (hora) => {
        const min = timeToMinutes(hora);
        if(min===0) return null;
        const lim1 = timeToMinutes('08:20'); const lim2 = timeToMinutes('08:30');
        if(min <= lim1) return 10;
        if(min > lim2) return 0;
        return Math.max(0, 10 - ((min - lim1) * 0.5));
      };
      const calcEntrada = (hora) => {
        const min = timeToMinutes(hora);
        if(min===0) return null;
        const opt = timeToMinutes('17:50'); const lim = timeToMinutes('17:40');
        if(min >= opt) return 10;
        if(min < lim) return 0;
        return Math.max(0, 10 - ((opt - min) * 0.5));
      };
      const calcReportes = (reps) => {
        let val=0, sum=0;
        reps.forEach(r=>{if(!r||r==='NA')return; val++; const t=r.toUpperCase().trim(); if(t==='SI')sum+=1; else if(['FT','FF'].includes(t))sum+=0.5;});
        return val===0?10:sum*(10/val);
      };

      // --- COMPONENTE: SEARCHABLE SELECT ---
      const SearchableSelect = ({ options, value, onChange, placeholder }) => {
        const [isOpen, setIsOpen] = useState(false);
        const [search, setSearch] = useState('');
        const wrapperRef = useRef(null);

        useEffect(() => {
          const handleClickOutside = (event) => {
            if (wrapperRef.current && !wrapperRef.current.contains(event.target)) { setIsOpen(false); setSearch(''); }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        const filteredOptions = options.filter(opt => opt.toLowerCase().includes(search.toLowerCase()));

        return (
          <div className="relative w-full" ref={wrapperRef}>
            <div className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm flex justify-between items-center cursor-pointer hover:border-indigo-300 focus-within:ring-2 focus-within:ring-indigo-100" onClick={() => setIsOpen(!isOpen)}>
              <span className={`truncate ${!value ? 'text-slate-400' : 'text-slate-700'}`}>{value || placeholder || "Seleccionar..."}</span>
              <Icons.ChevronDown size={16} className="text-slate-400"/>
            </div>
            {isOpen && (
              <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-hidden flex flex-col">
                <div className="p-2 border-b border-slate-100">
                  <div className="flex items-center bg-slate-50 rounded-lg px-2">
                    <Icons.Search size={14} className="text-slate-400"/>
                    <input type="text" className="w-full bg-transparent p-2 text-sm outline-none" placeholder="Buscar..." value={search} onChange={(e) => setSearch(e.target.value)} autoFocus />
                  </div>
                </div>
                <div className="overflow-y-auto custom-scrollbar flex-1">
                  <div className="px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm text-slate-600 font-bold" onClick={() => { onChange('Todos'); setIsOpen(false); }}>-- Todos --</div>
                  {filteredOptions.length > 0 ? (
                    filteredOptions.map(opt => (<div key={opt} className={`px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm ${value === opt ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-600'}`} onClick={() => { onChange(opt); setIsOpen(false); }}>{opt}</div>))
                  ) : (<div className="px-3 py-4 text-center text-xs text-slate-400">No hay resultados</div>)}
                </div>
              </div>
            )}
          </div>
        );
      };

      // --- COMPONENTE: MULTI-SELECT AGRUPADO ---
      const MultiSelectGrouped = ({ allTechsInLogs, activeList, selected, onChange }) => {
        const [isOpen, setIsOpen] = useState(false);
        const ref = useRef(null);

        const activeTechNames = activeList.filter(t => t.estado === 'ACTIVO').map(t => t.nombre);
        const groupActive = allTechsInLogs.filter(t => activeTechNames.includes(t));
        const groupInactive = allTechsInLogs.filter(t => !activeTechNames.includes(t));

        useEffect(() => {
          const handleClickOutside = (event) => { if (ref.current && !ref.current.contains(event.target)) setIsOpen(false); };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        const toggleOption = (option) => {
          let newSelected;
          if (option === 'Todos') newSelected = ['Todos'];
          else {
            const current = selected.filter(s => s !== 'Todos');
            if (current.includes(option)) newSelected = current.filter(s => s !== option);
            else newSelected = [...current, option];
            if (newSelected.length === 0) newSelected = ['Todos'];
          }
          onChange(newSelected);
        };

        const displayValue = selected.includes('Todos') ? 'Todos los técnicos' : selected.length === 1 ? selected[0] : `${selected.length} seleccionados`;

        return (
          <div className="relative w-full" ref={ref}>
            <button onClick={() => setIsOpen(!isOpen)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-left flex justify-between items-center hover:border-indigo-300 transition focus:outline-none focus:ring-2 focus:ring-indigo-100">
              <span className="truncate text-slate-700 font-medium">{displayValue}</span><Icons.ChevronDown size={16} className="text-slate-400"/>
            </button>
            {isOpen && (
              <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-60 overflow-y-auto custom-scrollbar">
                <div className={`px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2 text-sm border-b border-slate-100 ${selected.includes('Todos') ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}`} onClick={() => toggleOption('Todos')}>
                  <input type="checkbox" checked={selected.includes('Todos')} readOnly className="rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" /> <span className="font-bold">Todos</span>
                </div>
                {groupActive.length > 0 && (
                  <React.Fragment>
                    <div className="px-3 py-1 bg-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider sticky top-0">Activos</div>
                    {groupActive.map(op => (
                      <div key={op} className={`px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2 text-sm pl-4 ${selected.includes(op) ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}`} onClick={() => toggleOption(op)}>
                        <input type="checkbox" checked={selected.includes(op)} readOnly className="rounded text-indigo-600" /> <span className="truncate">{op}</span>
                      </div>
                    ))}
                  </React.Fragment>
                )}
                {groupInactive.length > 0 && (
                  <React.Fragment>
                    <div className="px-3 py-1 bg-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider sticky top-0 border-t border-slate-200">Historial / Otros</div>
                    {groupInactive.map(op => (
                      <div key={op} className={`px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2 text-sm pl-4 ${selected.includes(op) ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}`} onClick={() => toggleOption(op)}>
                         <input type="checkbox" checked={selected.includes(op)} readOnly className="rounded text-indigo-600" /> <span className="truncate">{op}</span>
                      </div>
                    ))}
                  </React.Fragment>
                )}
              </div>
            )}
          </div>
        );
      };

      // --- COMPONENTE: GALERÍA DE IMÁGENES ---
      const ImageGallery = ({ project, date }) => {
        const [images, setImages] = useState([]);
        const [loading, setLoading] = useState(false);
        useEffect(() => {
           if(!project || !date) return;
           setLoading(true);
           if (window.google && window.google.script) {
             window.google.script.run
               .withSuccessHandler(imgs => { setImages(imgs); setLoading(false); })
               .withFailureHandler(() => setLoading(false))
               .getReportImages(project, date);
           } else { setLoading(false); }
        }, [project, date]);

        if(loading) return <div className="text-xs text-slate-400 mt-2 animate-pulse">Buscando fotos...</div>;
        if(!images || images.length === 0) return null;

        return (
          <div className="mt-4 border-t border-slate-100 pt-3">
             <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1"><Icons.Image size={14}/> Evidencia Fotográfica</h4>
             <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 print:flex print:flex-row print:w-full">
               {images.map((img, i) => (
                 <img key={i} src={img} className="w-full h-24 object-cover rounded-lg border border-slate-200 cursor-pointer hover:opacity-80 transition shadow-sm print:w-1/4" onClick={() => {
                    const w = window.open("");
                    w.document.write('<img src="'+img+'" style="max-width:100%; height:auto;"/>');
                 }} />
               ))}
             </div>
          </div>
        )
      };

      // --- COMPONENTE MODAL RESUMEN ---
      const SummaryModal = ({ isOpen, onClose, data, type }) => {
        if (!isOpen) return null;
        let summaryText = "";

        if (type === 'evaluacion') {
           const { kpi, siteStats, avgs, processed, reports, filters } = data;
           const techCount = processed ? processed.length : 0;
           const totalIncidencias = processed ? processed.reduce((acc, curr) => acc + (curr.ret || 0) + (curr.fal || 0) + (curr.reg || 0), 0) : 0;
           
           const pad = (str, length) => String(str || '').substring(0, length).padEnd(length, ' ');
           
           // 1. CONSTRUIR LISTA DE REPORTES
           let reportesText = "";
           if (reports && reports.length > 0) {
             reports.forEach(r => {
               reportesText += `   - ${r.name}: ${r.val} registros\n`;
             });
           } else {
             reportesText += "   - Sin reportes registrados\n";
           }

           // 2. CONSTRUIR TABLA GENERAL DE TÉCNICOS
           let detailedTableText = `${pad("NOMBRE", 22)} | ${pad("SALIDA", 6)} | ${pad("ENTRADA", 7)} | ${pad("REPS", 5)} | ${pad("PAR", 3)} | ${pad("REG", 3)} | ${pad("RET", 3)} | ${pad("FAL", 3)} | ${pad("FINAL", 5)}\n`;
           detailedTableText += "-".repeat(85) + "\n";
           if(processed) {
             processed.forEach(p => { 
               detailedTableText += `${pad(p.nombre, 22)} | ${pad(p.sSal.toFixed(1), 6)} | ${pad(p.sEnt.toFixed(1), 7)} | ${pad(p.sRep.toFixed(1), 5)} | ${pad(p.sPar, 3)} | ${pad(p.reg, 3)} | ${pad(p.ret, 3)} | ${pad(p.fal, 3)} | ${pad(p.final.toFixed(2), 5)}\n`; 
             });
           }

           summaryText = `RESUMEN EJECUTIVO DE EVALUACIÓN
========================================
PERIODO: ${filters?.start} al ${filters?.end}
PROYECTO: ${filters?.proj}
TÉCNICOS EVALUADOS: ${techCount}

1. DESEMPEÑO GENERAL
   - Calificación Promedio Global: ${kpi?.scoreProj.toFixed(2)} / 10
   - Mejor Desempeño: ${kpi?.top ? kpi.top.nombre : 'N/A'} (${kpi?.top ? kpi.top.final.toFixed(2) : 0})
   - Promedio Calificación Reportes: ${kpi?.avgRep ? kpi.avgRep.toFixed(2) : 0}

2. DESGLOSE DE REPORTES ENVIADOS
${reportesText}
3. PUNTUALIDAD Y TIEMPOS
   - Promedio Hora Salida (AM): ${decimalToTimeStr(avgs?.avgAM)}
   - Promedio Hora Entrada (PM): ${decimalToTimeStr(avgs?.avgPM)}
   - Tiempo Promedio en Sitio: ${siteStats?.sitio} hrs
   - Hora Llegada Sitio Promedio: ${siteStats?.lleg}
   - Hora Salida Sitio Promedio: ${siteStats?.sal}

4. INCIDENCIAS OPERATIVAS
   - Total de Incidencias en Periodo: ${totalIncidencias}
     (Incluye retardos, faltas y regresos)

5. DETALLE POR TÉCNICO (TABLA COMPLETA)
${"-".repeat(85)}
${detailedTableText}
${"-".repeat(85)}

Generado automáticamente por Tablero de Evaluación`;

        } else {
          const { reports, project } = data;
          const statusCounts = {}; let totalHorasExtra = 0; let detailsText = "";
          if (reports) {
            reports.forEach(r => {
              const s = r.estatus || 'Sin Estatus'; statusCounts[s] = (statusCounts[s] || 0) + 1;
              if(r.cantHorasExtra) totalHorasExtra += (Number(r.cantHorasExtra) || 0);
              detailsText += `\nFECHA: ${r.fecha} | AUTOR: ${r.autor}\nACTIVIDADES: ${r.actividades}\nPENDIENTES: ${r.pendientes}\nESTATUS: ${r.estatus}\n----------------------------------------\n`;
            });
          }
          const estatusTexto = Object.keys(statusCounts).length > 0 
            ? Object.entries(statusCounts).map(([k,v]) => `   - ${k}: ${v}`).join('\n')
            : '   - Sin datos';

          summaryText = `RESUMEN DE PROYECTO (REPORTES DE OBRA)
========================================
PROYECTO: ${project}
TOTAL REPORTES: ${reports ? reports.length : 0}

1. ESTATUS DE AVANCE
${estatusTexto}

2. MÉTRICAS
   - Total Horas Extra Reportadas: ${totalHorasExtra}
   - Última Visita Registrada: ${reports && reports.length ? reports[reports.length-1].fecha : 'N/A'}

3. BITÁCORA DETALLADA DE ACTIVIDADES
${detailsText || '   - No hay actividades registradas.'}

Generado automáticamente por Sistema Integral`;
        }
        
        const copyToClipboard = () => { navigator.clipboard.writeText(summaryText); alert("Copiado al portapapeles"); };
        
        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4 print-hidden">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
              <div className="p-6 border-b border-slate-100 flex justify-between items-center"><h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icons.FileText size={24} className="text-indigo-600"/> Resumen de Datos</h2><button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500"><Icons.X size={20}/></button></div>
              <div className="p-6 overflow-y-auto custom-scrollbar flex-1"><div className="bg-slate-50 p-4 rounded-lg border border-slate-200 font-mono text-xs whitespace-pre-wrap text-slate-700 leading-relaxed">{summaryText}</div></div>
              <div className="p-6 border-t border-slate-100 flex justify-end gap-3"><button onClick={onClose} className="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg">Cerrar</button><button onClick={copyToClipboard} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2"><Icons.Copy size={18}/> Copiar</button></div>
            </div>
          </div>
        );
      };

      class ErrorBoundary extends Component {
        constructor(props) { super(props); this.state={hasError:false,error:null}; }
        static getDerivedStateFromError(error){return{hasError:true,error};}
        render(){ if(this.state.hasError){return(<div className="p-8 m-4 bg-red-50 text-center"><h2 className="text-xl font-bold text-red-600">Error</h2><div className="text-xs text-red-800">{this.state.error && this.state.error.toString()}</div><button onClick={()=>window.location.reload()} className="mt-4 px-4 py-2 bg-red-600 text-white rounded">Recargar</button></div>);} return this.props.children; }
      }

      // --- APP PRINCIPAL ---
      function App() {
        const [activeTab, setActiveTab] = useState('evaluacion');
        
        // ESTADOS EVALUACION
        const [dataEval, setDataEval] = useState([]);
        const [listActivos, setListActivos] = useState([]); 
        const [loadingEval, setLoadingEval] = useState(true);
        const [hasGeneratedEval, setHasGeneratedEval] = useState(false);
        const [inputsEval, setInputsEval] = useState({ start: '', end: '', tech: ['Todos'], proj: 'Todos' });
        const [filtersEval, setFiltersEval] = useState({ start: '', end: '', tech: ['Todos'], proj: 'Todos' });
        
        // ESTADOS REPORTES
        const [dataRepo, setDataRepo] = useState([]);
        const [loadingRepo, setLoadingRepo] = useState(false);
        const [hasGeneratedRepo, setHasGeneratedRepo] = useState(false);
        const [selectedRepoProj, setSelectedRepoProj] = useState('');
        
        const [msg, setMsg] = useState(null);
        const [showSummary, setShowSummary] = useState(false);
        const [isProcessing, setIsProcessing] = useState(false);

        const showToast = (text, type = 'success') => { setMsg({ text, type }); setTimeout(() => setMsg(null), 4000); };

        const fetchEvaluacionData = () => {
           setLoadingEval(true);
           if (window.google && window.google.script) {
             window.google.script.run.withSuccessHandler(res => {
                try { setListActivos(JSON.parse(res)); } catch(e){}
             }).getTecnicosActivos();

             window.google.script.run.withSuccessHandler(res => {
               const parsed = JSON.parse(res);
               if (parsed.length > 0) {
                 const cleanData = parsed.map(item => ({...item, fecha: normalizeDate(item.fecha)}));
                 setDataEval(cleanData);
                 const sortedDates = cleanData.map(d => d.fecha).sort();
                 const lastDate = sortedDates[sortedDates.length - 1];
                 const firstDayStr = lastDate.substring(0, 7) + '-01'; 
                 if(!inputsEval.start) {
                   setInputsEval(prev => ({ ...prev, start: firstDayStr, end: lastDate }));
                 }
                 showToast(`✅ Base de datos (Eval) actualizada: ${cleanData.length} registros.`);
               }
               setLoadingEval(false);
             }).getDataBitacora();
           } else {
             setTimeout(() => { setLoadingEval(false); }, 1000);
           }
        };

        useEffect(() => { fetchEvaluacionData(); }, []);

        useEffect(() => {
          if (activeTab === 'reportes' && dataRepo.length === 0) {
             setLoadingRepo(true);
             if (window.google && window.google.script) {
                window.google.script.run.withSuccessHandler(res => {
                  const parsed = JSON.parse(res);
                  if (parsed.length > 0) {
                     const clean = parsed.map(i => ({...i, fecha: normalizeDate(i.fecha)}));
                     setDataRepo(clean);
                     showToast(`✅ Reportes: ${clean.length} registros cargados.`);
                  }
                  setLoadingRepo(false);
                }).getDataReportes();
             } else { setLoadingRepo(false); }
          }
        }, [activeTab]);

        const uniqueTechs = useMemo(() => ['Todos', ...new Set(dataEval.map(d=>d.nombre))].sort(), [dataEval]);
        const uniqueProjectsEval = useMemo(() => ['Todos', ...new Set(dataEval.map(d=>d.proyecto))].sort(), [dataEval]);
        const uniqueProjectsRepo = useMemo(() => [...new Set(dataRepo.map(d=>d.proyecto))].sort(), [dataRepo]);

        // --- MEMO EVALUACION ---
        const processedEval = useMemo(() => {
          const defaultReturn = { 
            processed: [], top3List: [], rawFilteredData: [], kpi: { scoreProj: 0, top: null, avgRep: 0 }, 
            charts: { am: [], pm: [] }, reports: [], avgs: { avgAM: 0, avgPM: 0 }, 
            siteStats: { lleg: '--:--', sal: '--:--', sitio: '--:--' }, 
            domains: { am: ['auto', 'auto'], pm: ['auto', 'auto'] }, filters: filtersEval 
          };

          if(!dataEval.length || !hasGeneratedEval) return defaultReturn;

          const filtered = dataEval.filter(r => {
            const p = filtersEval.proj==='Todos' || r.proyecto===filtersEval.proj;
            const t = filtersEval.tech.includes('Todos') || filtersEval.tech.includes(r.nombre);
            const d = filtersEval.proj!=='Todos' || (r.fecha >= filtersEval.start && r.fecha <= filtersEval.end);
            
            // EXCLUSIÓN DE PMI PARA JUSTICIA
            const notPMI = !r.nombre.toUpperCase().includes('PMI');
            return p && t && d && notPMI;
          });

          const groups = {}; 
          const repCounts = {'SI':0,'FT':0,'FF':0,'FT FF':0,'NO':0,'NA':0};
          
          filtered.forEach(r => {
             const rt = r.reporteEnv ? r.reporteEnv.toUpperCase().trim() : 'NA'; 
             if(repCounts[rt] !== undefined) repCounts[rt]++; 
             else if(rt === 'FT FF') repCounts['FT FF']++;

             if(!groups[r.nombre]) groups[r.nombre]={re:[], sal:0, salC:0, ent:0, entC:0, reps:[], par:0, reg:0, ret:0, fal:0, hS:0, hE:0, hC:0};
             const g=groups[r.nombre]; g.re.push(r);
             
             const sS=calcSalida(r.horaSalida); if(sS!==null){g.sal+=sS;g.salC++}
             const sE=calcEntrada(r.horaEntrada); if(sE!==null){g.ent+=sE;g.entC++}
             
             g.reps.push(r.reporteEnv);
             if(!['VACACIONES','PERMISO','INCAPACIDAD'].some(x=>(r.nota||'').toUpperCase().includes(x))) g.par+=(Number(r.tiempoParadas)||0);
             g.reg+=(Number(r.regresos)||0);
             const as=(r.asistencia||'').toUpperCase(); if(as==='RETARDO')g.ret++; if(as==='FALTA')g.fal++;
             if(r.horaSalProy && r.horaLlegProy && r.horaSalProy!=='00:00' && r.horaLlegProy!=='00:00') { g.hS+=timeToMinutes(r.horaLlegProy); g.hE+=timeToMinutes(r.horaSalProy); g.hC++; }
          });

          const res = Object.keys(groups).map(n=>{
            const g=groups[n];
            const c = g.re.length;
            const scSal=g.salC>0?g.sal/g.salC:10; 
            const scEnt=g.entC>0?g.ent/g.entC:10;
            const scRep=calcReportes(g.reps); const scPar=g.par>10?0:10;
            const pen=(g.reg*0.5)+(g.ret*0.5)+(g.fal*1.0);
            const safe=(v)=>isNaN(v)?0:v;
            const final=Math.max(0,(safe(scSal)*0.25 + safe(scEnt)*0.25 + safe(scRep)*0.4 + safe(scPar)*0.1)-pen);
            const avS=g.hC?g.hS/g.hC:0; const avE=g.hC?g.hE/g.hC:0; const dur=avE>avS?avE-avS:0;
            // Se pasa registros: c para no romper la variable que se usaba
            return {nombre:n, registros:c, sSal:scSal, sEnt:scEnt, sRep:scRep, sPar:scPar, reg:g.reg, ret:g.ret, fal:g.fal, final, tLleg:minutesToTime(avS), tSal:minutesToTime(avE), tSitio:dur>0?minutesToTime(dur):'--:--'};
          }).sort((a,b)=>b.final-a.final);

          // LOGICA DE JUSTICIA
          // Tomar el que tiene mayor número de asistencias
          const maxRegistros = res.length > 0 ? Math.max(...res.map(t => t.registros)) : 0;
          // Si el proyecto duró menos de 4 días, entran todos. Si duró más, exigimos un mínimo de 25% del líder.
          const umbralJusticia = maxRegistros <= 3 ? 1 : Math.ceil(maxRegistros * 0.25);
          
          const validCandidates = res.filter(t => t.registros >= umbralJusticia);
          const top3List = validCandidates.length > 0 ? validCandidates.slice(0,3) : res.slice(0,3);
          const top = top3List.length > 0 ? top3List[0] : (res.length > 0 ? res[0] : null);

          let am=[], pm=[];
          const isMulti = filtersEval.proj==='Todos' && (filtersEval.tech.includes('Todos')||filtersEval.tech.length>1);
          
          if (isMulti) {
            Object.keys(groups).sort().forEach(n => {
              const g=groups[n];
              const s = g.re.map(x=>timeToDecimal(x.horaSalida)).filter(v=>v!==null); if(s.length) am.push({label:n, val:s.reduce((a,b)=>a+b,0)/s.length});
              const e = g.re.map(x=>timeToDecimal(x.horaEntrada)).filter(v=>v!==null); if(e.length) pm.push({label:n, val:e.reduce((a,b)=>a+b,0)/e.length});
            });
          } else {
             const dates = [...new Set(filtered.map(x=>x.fecha))].sort();
             dates.forEach(d => {
                const rows = filtered.filter(x=>x.fecha===d);
                const s = rows.map(x=>timeToDecimal(x.horaSalida)).filter(v=>v!==null); if(s.length) am.push({label:d, val:s.reduce((a,b)=>a+b,0)/s.length});
                const e = rows.map(x=>timeToDecimal(x.horaEntrada)).filter(v=>v!==null); if(e.length) pm.push({label:d, val:e.reduce((a,b)=>a+b,0)/e.length});
             });
          }

          const scoreProj = res.length ? res.reduce((a,b)=>a+b.final,0)/res.length : 0;
          const avgRep = res.length ? res.reduce((a,b)=>a+b.sRep,0)/res.length : 0;
          const avgAM = am.length ? am.reduce((a,b)=>a+b.val,0)/am.length : 0;
          const avgPM = pm.length ? pm.reduce((a,b)=>a+b.val,0)/pm.length : 0;
          
          let tL=0, tS=0, tD=0, tC=0; Object.values(groups).forEach(g=>{ if(g.hC>0){tL+=g.hS/g.hC; tS+=g.hE/g.hC; const d=(g.hE/g.hC)-(g.hS/g.hC); tD+=(d>0?d:0); tC++;}});
          const siteStats = {lleg:tC?minutesToTime(tL/tC):'--', sal:tC?minutesToTime(tS/tC):'--', sitio:tC?minutesToTime(tD/tC):'--'};
          const repData = ['SI','FT','FF','FT FF','NO','NA'].filter(k=>repCounts[k]>0).map(k=>({name:k, val:repCounts[k]}));
          const getDomain = (d) => {if(!d.length)return['auto','auto']; const v=d.map(x=>x.val); return [Math.min(...v)-0.2, Math.max(...v)+0.2]};

          return { processed: res, top3List, rawFilteredData: filtered, kpi: {scoreProj, top, avgRep}, charts: {am, pm}, reports: repData, avgs: {avgAM, avgPM}, siteStats, domains: {am:getDomain(am), pm:getDomain(pm)}, filters: filtersEval };
        }, [dataEval, filtersEval, hasGeneratedEval]);

        // --- MEMO REPORTES ---
        const processedRepo = useMemo(() => {
          if (!hasGeneratedRepo || !selectedRepoProj) return [];
          return dataRepo.filter(r => r.proyecto === selectedRepoProj).sort((a,b) => a.fecha.localeCompare(b.fecha));
        }, [dataRepo, selectedRepoProj, hasGeneratedRepo]);

        const COLORS = { 'SI':'#10B981', 'FT':'#6366F1', 'FF':'#8B5CF6', 'FT FF':'#EF4444', 'NO':'#EF4444', 'NA':'#9CA3AF' };
        
        const { processed, top3List, kpi, charts, reports, avgs, siteStats, domains } = processedEval;
        
        // --- AQUÍ ESTÁ EL AJUSTE DE ALTURA DINÁMICA (MAS ESPACIO PARA NOMBRES) ---
        const dynamicHeightPunt = charts && charts.am ? Math.max(350, charts.am.length * 40) : 350;
        const dynamicHeightRank = processed ? Math.max(300, processed.length * 40) : 300;

        return (
          <div className="min-h-screen p-4 md:p-8 bg-slate-50">
            {msg && <div className={`toast px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2 ${msg.type==='error'?'bg-red-500':'bg-emerald-600'}`}><span>{msg.text}</span></div>}
            
            <SummaryModal isOpen={showSummary} onClose={()=>setShowSummary(false)} 
              data={activeTab==='evaluacion' ? processedEval : { reports: processedRepo, project: selectedRepoProj }} 
              type={activeTab} />

            {/* HEADER TABS */}
            <div className="mb-6 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden print-hidden">
              <div className="p-6 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <h1 className="text-3xl font-bold text-slate-800">Sistema Integral</h1>
                <div className="flex gap-2">
                  <button onClick={fetchEvaluacionData} className="p-2 text-slate-400 hover:text-blue-500 transition border border-slate-200 rounded-lg"><Icons.RefreshCw size={20}/></button>
                  <button onClick={()=>window.print()} className="flex gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900"><Icons.Download size={18}/> PDF</button>
                </div>
              </div>
              <div className="flex border-t border-slate-100">
                <button onClick={() => setActiveTab('evaluacion')} className={`flex-1 py-4 text-center font-bold flex justify-center items-center gap-2 transition ${activeTab==='evaluacion' ? 'bg-indigo-50 text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:bg-slate-50'}`}><Icons.LayoutDashboard size={20}/> Evaluación Desempeño</button>
                <button onClick={() => setActiveTab('reportes')} className={`flex-1 py-4 text-center font-bold flex justify-center items-center gap-2 transition ${activeTab==='reportes' ? 'bg-indigo-50 text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:bg-slate-50'}`}><Icons.ClipboardList size={20}/> Reportes de Obra</button>
              </div>
            </div>

            {/* VISTA EVALUACION */}
            {activeTab === 'evaluacion' && (
              <div className="fade-in">
                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6 print-hidden">
                  <div className={`col-span-12 md:col-span-4 bg-white p-4 rounded-xl border border-slate-200 ${inputsEval.proj!=='Todos'?'opacity-50 pointer-events-none':''}`}>
                    <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Periodo</label>
                    <div className="flex gap-4"><input type="date" value={inputsEval.start} onChange={e=>setInputsEval({...inputsEval, start: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded p-2 text-sm"/><input type="date" value={inputsEval.end} onChange={e=>setInputsEval({...inputsEval, end: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded p-2 text-sm"/></div>
                  </div>
                  <div className="col-span-12 md:col-span-6 grid grid-cols-2 gap-4">
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Técnico</label>
                      <MultiSelectGrouped allTechsInLogs={uniqueTechs} activeList={listActivos} selected={inputsEval.tech} onChange={val => setInputsEval({...inputsEval, tech: val})} />
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200"><label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Proyecto</label><SearchableSelect options={uniqueProjectsEval} value={inputsEval.proj === 'Todos' ? '' : inputsEval.proj} onChange={val => setInputsEval({...inputsEval, proj: val || 'Todos'})} placeholder="Buscar Proyecto..." /></div>
                  </div>
                  <div className="col-span-12 md:col-span-2 flex items-stretch">
                    <button onClick={() => { if(!dataEval.length) return showToast("Sin datos","error"); setIsProcessing(true); setTimeout(() => { setFiltersEval(inputsEval); setHasGeneratedEval(true); setIsProcessing(false); }, 500); }} disabled={isProcessing} className={`w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition flex flex-col items-center justify-center gap-2 ${isProcessing ? 'processing' : ''}`}>{isProcessing ? <Icons.Loader2 size={24}/> : <Icons.Play size={24}/>} {isProcessing ? '...' : 'GENERAR'}</button>
                  </div>
                </div>

                {loadingEval ? <div className="text-center py-20 text-slate-400 animate-pulse">Conectando Bitácora...</div> : !hasGeneratedEval ? (
                  <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 border-dashed print-hidden"><div className="inline-block p-4 bg-indigo-50 rounded-full mb-4"><Icons.Database size={32} className="text-indigo-400"/></div><h3 className="text-xl font-bold text-slate-700">Listo para evaluar</h3><p className="text-slate-400 mt-2">{dataEval.length} registros disponibles.</p></div>
                ) : (
                  <React.Fragment>
                    <div className="flex justify-between mb-4 print-hidden">
                      <button onClick={()=> { setInputsEval({ start: inputsEval.start, end: inputsEval.end, tech: ['Todos'], proj: 'Todos' }); setHasGeneratedEval(false); }} className="text-sm text-slate-400 hover:text-indigo-600 flex items-center gap-1 border px-3 py-1 rounded-lg bg-white"><Icons.XCircle size={16}/> Limpiar Filtros</button>
                      <button onClick={()=>setShowSummary(true)} className="text-sm text-indigo-600 font-bold hover:underline flex items-center gap-1"><Icons.FileText size={16}/> Ver Resumen Texto</button>
                    </div>
                    
                    <div className="hidden print-block mb-6 text-center">
                      <h1 className="text-2xl font-bold">Evaluación de Desempeño: {filtersEval.proj !== 'Todos' ? filtersEval.proj : 'Global'}</h1>
                      <p className="text-slate-500">Periodo evaluado: {filtersEval.start} al {filtersEval.end}</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 print-row gap-6 mb-6">
                      <div className="bg-gradient-to-r from-indigo-500 to-purple-600 print-no-shadow print-col-2 rounded-xl p-6 text-white print:text-slate-800 shadow-lg flex justify-between items-center"><div><p className="text-indigo-100 print:text-slate-500 font-medium mb-1">Mejor Desempeño</p><h2 className="text-2xl font-bold">{kpi.top?.nombre||'N/A'}</h2></div><div className="text-right"><span className="text-4xl font-bold">{kpi.top?.final.toFixed(2)||0}</span></div></div>
                      <div className="bg-gradient-to-r from-blue-500 to-cyan-600 print-no-shadow print-col-2 rounded-xl p-6 text-white print:text-slate-800 shadow-lg flex justify-between items-center"><div><p className="text-blue-100 print:text-slate-500 font-medium mb-1">Promedio General</p><h2 className="text-2xl font-bold">{filtersEval.proj}</h2></div><div className="text-right"><span className="text-4xl font-bold">{kpi.scoreProj.toFixed(2)}</span></div></div>
                    </div>
                    
                    {/* GRÁFICOS TIEMPO - APLICANDO ALTURA DINÁMICA INDIVIDUAL */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 mb-6 print-no-shadow print-avoid-break">
                      <h3 className="font-bold text-slate-700 mb-4 flex gap-2"><Icons.Clock size={18} className="text-slate-500"/> Puntualidad</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 print-row gap-6">
                        
                        <div className="border rounded-lg p-3 bg-orange-50/10 print-col-2 flex flex-col" style={{ height: dynamicHeightPunt }}>
                          <p className="text-xs font-bold text-orange-600 text-center mb-2">Salida AM (Prom: {decimalToTimeStr(avgs.avgAM)})</p>
                          {charts.am && charts.am.length > 0 ? (
                            <ResponsiveContainer width="100%" height="100%"><ComposedChart layout="vertical" data={charts.am} margin={{top:10,right:20,bottom:10,left:10}}><CartesianGrid strokeDasharray="3 3" horizontal vertical/> <XAxis type="number" domain={domains.am} tickCount={6} tickFormatter={decimalToTimeStr}/> <YAxis type="category" dataKey="label" width={110} tick={{fontSize:10}}/> <RechartsTooltip/> <ReferenceLine x={8.33} stroke="#F97316"/> <Scatter dataKey="val" fill="#F97316" isAnimationActive={false}/></ComposedChart></ResponsiveContainer>
                          ) : <div className="flex-1 flex justify-center items-center text-xs text-slate-400">Sin datos</div>}
                        </div>
                        
                        <div className="border rounded-lg p-3 bg-blue-50/10 print-col-2 flex flex-col" style={{ height: dynamicHeightPunt }}>
                          <p className="text-xs font-bold text-blue-600 text-center mb-2">Entrada PM (Prom: {decimalToTimeStr(avgs.avgPM)})</p>
                          {charts.pm && charts.pm.length > 0 ? (
                            <ResponsiveContainer width="100%" height="100%"><ComposedChart layout="vertical" data={charts.pm} margin={{top:10,right:20,bottom:10,left:10}}><CartesianGrid strokeDasharray="3 3" horizontal vertical/> <XAxis type="number" domain={domains.pm} tickCount={6} tickFormatter={decimalToTimeStr}/> <YAxis type="category" dataKey="label" width={110} tick={{fontSize:10}}/> <RechartsTooltip/> <ReferenceLine x={17.83} stroke="#3B82F6"/> <Scatter dataKey="val" fill="#3B82F6" isAnimationActive={false}/></ComposedChart></ResponsiveContainer>
                          ) : <div className="flex-1 flex justify-center items-center text-xs text-slate-400">Sin datos</div>}
                        </div>
                        
                      </div>
                    </div>
                    
                    {/* RESTO EVAL */}
                    <div className="grid grid-cols-1 xl:grid-cols-2 print-row gap-6 mb-6 print-avoid-break">
                       <div className="bg-white p-5 rounded-2xl border border-slate-200 h-64 print-no-shadow print-col-2 print-chart-fixed"><h3 className="font-bold text-slate-700 mb-2 flex gap-2"><Icons.Award size={18} className="text-yellow-500"/> Top 3 Líderes</h3><div className="h-full pb-6">{top3List && top3List.length > 0 ? <ResponsiveContainer><BarChart data={top3List} layout="vertical" margin={{left:0,right:20}}><XAxis type="number" domain={[0,10]} hide/> <YAxis type="category" dataKey="nombre" width={70} tick={{fontSize:11,fontWeight:'bold'}}/> <Bar dataKey="final" barSize={20} radius={[0,4,4,0]} fill="#F59E0B" isAnimationActive={false}><LabelList dataKey={d=>d.final.toFixed(2)} position="right" fontSize={11} fontWeight="bold"/></Bar></BarChart></ResponsiveContainer>:<div className="h-full flex justify-center items-center text-xs text-slate-400">Sin datos</div>}</div></div>
                       
                       <div className="bg-white p-5 rounded-2xl border border-slate-200 h-64 print-no-shadow print-col-2 print-chart-fixed">
                         <div className="flex justify-between items-center mb-2"><h3 className="font-bold text-slate-700 flex gap-2"><Icons.CheckCircle size={18} className="text-indigo-500"/> Reportes</h3><span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-bold">Calif. Prom: {kpi.avgRep ? kpi.avgRep.toFixed(2) : 0}/10</span></div>
                         <div className="h-full pb-6">{reports && reports.length > 0 ? <ResponsiveContainer><PieChart><Pie data={reports} dataKey="val" nameKey="name" cx="50%" cy="50%" outerRadius={70} label={({name, val}) => `${name}: ${val}`} isAnimationActive={false}>{reports.map((entry, index) => (<Cell key={`cell-${index}`} fill={COLORS[entry.name]} />))}</Pie><RechartsTooltip /> <Legend verticalAlign="bottom" height={36}/></PieChart></ResponsiveContainer>:<div className="h-full flex justify-center items-center text-xs text-slate-400">Sin reportes</div>}</div>
                       </div>
                    </div>
                    
                    {/* RANKING */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 mb-6 print-avoid-break print-no-shadow"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-700 flex gap-2"><Icons.TrendingUp size={18} className="text-slate-500"/> Ranking General</h3><span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">Promedio: {kpi.scoreProj.toFixed(2)}</span></div><div style={{ height: dynamicHeightRank }}>{processed && processed.length > 0 ? <ResponsiveContainer><BarChart data={processed} layout="vertical" margin={{left:0,right:20}}><XAxis type="number" domain={[0,10]} hide/> <YAxis type="category" dataKey="nombre" width={90} tick={{fontSize:10}} interval={0}/> <ReferenceLine x={kpi.scoreProj} stroke="red" strokeDasharray="3 3" /> <Bar dataKey="final" barSize={12} radius={[0,4,4,0]} fill="#64748B" isAnimationActive={false}><LabelList dataKey={d=>d.final.toFixed(1)} position="right" fontSize={10}/></Bar></BarChart></ResponsiveContainer>:<div className="h-full flex justify-center items-center text-xs text-slate-400">Sin datos</div>}</div></div>
                    
                    {/* DETALLES */}
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-8 print-page-break print-no-shadow"><div className="p-6 border-b border-slate-100 bg-slate-50/50 print-bg-transparent"><h2 className="font-bold text-lg text-slate-800">Detalle Técnico</h2></div><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50 text-xs uppercase text-slate-500 font-bold"><tr><th className="px-4 py-3 pl-6">Nombre</th><th className="px-2 py-3 text-center">Salida</th><th className="px-2 py-3 text-center">Entrada</th><th className="px-2 py-3 text-center">Reporte</th><th className="px-2 py-3 text-center">Parada</th><th className="px-2 py-3 text-center text-red-400">Reg</th><th className="px-2 py-3 text-center text-red-400">Ret</th><th className="px-2 py-3 text-center text-red-400">Fal</th><th className="px-4 py-3 text-center bg-indigo-50 text-indigo-700">Final</th></tr></thead><tbody className="divide-y divide-slate-100">{processed && processed.map(t=>(<tr key={t.nombre} className="hover:bg-slate-50 transition"><td className="px-4 py-3 pl-6 font-medium">{t.nombre}</td><td className="px-2 py-3 text-center">{t.sSal.toFixed(1)}</td><td className="px-2 py-3 text-center">{t.sEnt.toFixed(1)}</td><td className="px-2 py-3 text-center">{t.sRep.toFixed(1)}</td><td className="px-2 py-3 text-center">{t.sPar}</td><td className="px-2 py-3 text-center text-red-500 bg-red-50/30">{t.reg||'-'}</td><td className="px-2 py-3 text-center text-red-500 bg-red-50/30">{t.ret||'-'}</td><td className="px-2 py-3 text-center text-red-500 bg-red-50/30">{t.fal||'-'}</td><td className="px-4 py-3 text-center font-bold text-lg text-indigo-700 bg-indigo-50/30">{t.final.toFixed(2)}</td></tr>))}</tbody></table></div></div>
                    
                    {/* TABLA TIEMPOS */}
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden print-avoid-break print-no-shadow"><div className="p-5 border-b border-slate-100 print-bg-transparent"><h3 className="font-bold text-slate-700 flex gap-2"><Icons.MapPin size={18} className="text-teal-500"/> Tiempos Sitio</h3></div><table className="w-full text-sm text-left text-slate-600"><thead className="bg-slate-50 text-xs uppercase text-slate-500 font-bold"><tr><th className="px-6 py-3 pl-6">Técnico</th><th className="px-6 py-3 text-center">Llegada Prom.<br/><span className="text-[10px] font-normal text-teal-600 bg-teal-50 px-2 rounded">Prom: {siteStats.lleg}</span></th><th className="px-6 py-3 text-center">Salida Prom.<br/><span className="text-[10px] font-normal text-teal-600 bg-teal-50 px-2 rounded">Prom: {siteStats.sal}</span></th><th className="px-6 py-3 text-center bg-teal-50 text-teal-700">Tiempo Sitio<br/><span className="text-[10px] font-bold">Prom: {siteStats.sitio}</span></th></tr></thead><tbody className="divide-y divide-slate-100">{processed && processed.map(t=>(<tr key={t.nombre}><td className="px-6 py-3 pl-6 font-medium">{t.nombre}</td><td className="px-6 py-3 text-center font-mono">{t.tLleg}</td><td className="px-6 py-3 text-center font-mono">{t.tSal}</td><td className="px-6 py-3 text-center font-mono font-bold text-teal-600 bg-teal-50/30">{t.tSitio} hr</td></tr>))}</tbody></table></div>
                  </React.Fragment>
                )}
              </div>
            )}

            {/* VISTA REPORTES */}
            {activeTab === 'reportes' && (
              <div className="fade-in">
                <div className="bg-white p-6 rounded-xl border border-slate-200 mb-6 print-hidden">
                  <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">Seleccionar Proyecto</label>
                  <div className="flex gap-4">
                    <SearchableSelect options={uniqueProjectsRepo} value={selectedRepoProj} onChange={val => setSelectedRepoProj(val)} placeholder="Buscar Proyecto..." />
                    <button onClick={() => { 
                      if(!selectedRepoProj) return showToast("Selecciona un proyecto", "error");
                      setIsProcessing(true);
                      setTimeout(() => { setHasGeneratedRepo(true); setIsProcessing(false); }, 500);
                    }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 rounded-xl shadow-lg transition flex items-center gap-2">
                      {isProcessing ? <Icons.Loader2 className="animate-spin"/> : <Icons.Search/>} GENERAR
                    </button>
                  </div>
                </div>

                {loadingRepo ? <div className="text-center py-20 text-slate-400 animate-pulse">Cargando Reportes...</div> : 
                 !hasGeneratedRepo ? (
                   <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 border-dashed print-hidden">
                     <div className="inline-block p-4 bg-emerald-50 rounded-full mb-4"><Icons.ClipboardList size={32} className="text-emerald-500"/></div>
                     <h3 className="text-xl font-bold text-slate-700">Historial de Reportes</h3>
                     <p className="text-slate-400 mt-2">{dataRepo.length} reportes disponibles en el sistema.</p>
                   </div>
                 ) : (
                   <div className="space-y-6">
                     <div className="flex justify-between items-center print-hidden">
                       <h2 className="text-xl font-bold text-slate-800">Historial: {selectedRepoProj}</h2>
                       <div className="flex gap-2">
                         <button onClick={() => { setSelectedRepoProj(''); setHasGeneratedRepo(false); }} className="text-sm text-slate-400 hover:text-slate-600 flex items-center gap-1 border px-3 py-1 rounded-lg bg-white"><Icons.XCircle size={14}/> Limpiar</button>
                         <button onClick={() => setShowSummary(true)} className="text-sm bg-emerald-50 text-emerald-700 font-bold px-3 py-1 rounded-lg flex items-center gap-1 hover:bg-emerald-100 transition"><Icons.FileText size={14}/> Ver Resumen</button>
                       </div>
                     </div>
                     <div className="hidden print-block mb-4 text-center">
                        <h1 className="text-2xl font-bold">Bitácora de Obra: {selectedRepoProj}</h1>
                     </div>

                     {/* TIMELINE */}
                     {processedRepo.length === 0 ? (
                       <div className="p-10 text-center text-slate-400 bg-white rounded-xl border border-slate-100">No hay reportes para este proyecto.</div>
                     ) : (
                       <div className="relative border-l-2 border-slate-200 ml-4 space-y-8 pb-4 print-border-none print-ml-0">
                         {processedRepo.map((report, idx) => (
                           <div key={idx} className="ml-6 relative print-ml-0 print-avoid-break mb-6">
                             <div className="absolute -left-[31px] top-0 bg-white border-2 border-indigo-500 w-4 h-4 rounded-full print-hidden"></div>
                             <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition print-no-shadow">
                               <div className="flex flex-col md:flex-row justify-between mb-4 border-b border-slate-50 pb-4 gap-4">
                                 <div>
                                   <div className="flex items-center gap-2 mb-1">
                                     <span className="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded flex items-center gap-1"><Icons.Calendar size={12}/> {report.fecha}</span>
                                     <span className="text-slate-400 text-xs flex items-center gap-1"><Icons.Clock size={12}/> {report.inicio} - {report.fin}</span>
                                   </div>
                                   <h3 className="font-bold text-slate-800 text-lg">{report.autor}</h3>
                                   <p className="text-xs text-slate-500">Equipo: {report.equipo}</p>
                                 </div>
                                 <div className="text-right">
                                   <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${
                                     (report.estatus||'').includes('Terminado') ? 'bg-green-100 text-green-700' : 
                                     (report.estatus||'').includes('Proceso') ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'
                                   }`}>
                                     {report.estatus}
                                   </span>
                                   {report.cantHorasExtra && report.cantHorasExtra !== '0' && (
                                     <div className="mt-2 text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded flex items-center justify-end gap-1">
                                       <Icons.AlertTriangle size={12}/> {report.cantHorasExtra} Hrs Extra
                                     </div>
                                   )}
                                 </div>
                               </div>
                               <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                 <div>
                                   <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1"><Icons.CheckSquare size={14}/> Actividades Realizadas</h4>
                                   <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{report.actividades || 'Sin registro'}</p>
                                 </div>
                                 <div>
                                   <h4 className="text-xs font-bold text-red-400 uppercase mb-2 flex items-center gap-1"><Icons.AlertTriangle size={14}/> Pendientes / Comentarios</h4>
                                   <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100">
                                     {report.pendientes || report.comentarios || 'Sin observaciones'}
                                   </p>
                                 </div>
                               </div>
                               <ImageGallery project={report.proyecto} date={report.fecha} />
                             </div>
                           </div>
                         ))}
                       </div>
                     )}
                   </div>
                 )
            }
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
</html>
