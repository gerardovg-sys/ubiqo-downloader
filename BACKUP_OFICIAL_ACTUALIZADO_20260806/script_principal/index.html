      // --- UTILS ---
      const timeToMinutes = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string' || timeStr === '00:00') return 0;
        try { const [h, m] = timeStr.split(':').map(Number); return (h||0)*60 + (m||0); } catch (e) { return 0; }
      };
      const minutesToTime = (total) => {
        if (!total && total !== 0) return '00:00';
        const h = Math.floor(total / 60); const m = Math.floor(total % 60); 
        return `${h.toString().padStart(2,'0')}:${Math.round(m).toString().padStart(2,'0')}`;
      };
      const timeToDecimal = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string' || timeStr === '00:00') return null;
        const [h, m] = timeStr.split(':').map(Number); return h + (m/60);
      };
      const decimalToTimeStr = (decimal) => {
        if (decimal === null || decimal === undefined) return '';
        const h = Math.floor(decimal); const m = Math.round((decimal - h) * 60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
      };
      const normalizeDate = (dateStr) => {
        if (!dateStr) return '';
        const str = String(dateStr).trim();
        // Extrae YYYY-MM-DD incluso si viene con T06:00:00.000Z
        const match = str.match(/^(\d{4})[\-\/](\d{2})[\-\/](\d{2})/);
        if (match) {
          return `${match[1]}-${match[2]}-${match[3]}`;
        }
        const cleanStr = str.split(' ')[0]; 
        const parts = cleanStr.split(/[\/\-]/);
        if (parts.length === 3) {
          let p1 = parts[0].padStart(2, '0');
          let p2 = parts[1].padStart(2, '0');
          let year = parts[2];
          
          if (p1.length === 4) {
            year = p1;
            p1 = parts[1].padStart(2, '0');
            p2 = parts[2].padStart(2, '0');
          }
          
          const v1 = parseInt(p1, 10);
          const v2 = parseInt(p2, 10);
          let day = p1, month = p2;
          
          if (v1 > 12) {
            day = String(v1).padStart(2, '0');
            month = String(v2).padStart(2, '0');
          } else if (v2 > 12) {
            day = String(v2).padStart(2, '0');
            month = String(v1).padStart(2, '0');
          }
          return `${year}-${month}-${day}`;
        }
        return cleanStr; 
      };

      const parseLocalDate = (dateStr) => {
        if (!dateStr) return null;
        const str = String(dateStr).trim();
        // Intentar YYYY-MM-DD
        const matchYmd = str.match(/^(\d{4})[\-\/](\d{2})[\-\/](\d{2})/);
        if (matchYmd) {
          const year = parseInt(matchYmd[1], 10);
          const month = parseInt(matchYmd[2], 10);
          const day = parseInt(matchYmd[3], 10);
          
          let y = year, m = month, d = day;
          if (month > 12) {
            // Caso donde la fecha viene formateada YYYY-DD-MM por error
            m = day;
            d = month;
          }
          return new Date(y, m - 1, d);
        }
        // Intentar DD/MM/YYYY o MM/DD/YYYY
        const matchDmy = str.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);
        if (matchDmy) {
          const p1 = parseInt(matchDmy[1], 10);
          const p2 = parseInt(matchDmy[2], 10);
          const year = parseInt(matchDmy[3], 10);
          
          let day, month;
          if (p1 > 12) {
            day = p1;
            month = p2;
          } else if (p2 > 12) {
            day = p2;
            month = p1;
          } else {
            day = p1;
            month = p2; // Por defecto DD/MM/YYYY
          }
          return new Date(year, month - 1, day);
        }
        // Fallback estándar
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }
        return null;
      };

      const calculateDeadline = (startDateObj, workingDays, reportDatesSet) => {
        if (!startDateObj || isNaN(startDateObj.getTime())) return null;
        if (workingDays <= 0) return startDateObj;
        
        let currentDate = new Date(startDateObj);
        let count = 0;
        
        while (count < workingDays) {
          if (count > 0) {
            currentDate.setDate(currentDate.getDate() + 1);
          }
          const dayOfWeek = currentDate.getDay(); // 0 = Domingo, 6 = Sábado
          const dateISO = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
          
          const isWorkingDay = (dayOfWeek !== 0 && dayOfWeek !== 6) || (reportDatesSet && reportDatesSet.has(dateISO));
          
          if (isWorkingDay) {
            count++;
          } else if (count === 0) {
            currentDate.setDate(currentDate.getDate() + 1);
          }
        }
        return currentDate;
      };

      const countBusinessDays = (startObj, endObj, reportDatesSet) => {
        if (!startObj || !endObj || isNaN(startObj.getTime()) || isNaN(endObj.getTime())) return 0;
        if (startObj.getTime() > endObj.getTime()) return 0;
        
        let temp = new Date(startObj);
        let count = 0;
        while (temp.getTime() <= endObj.getTime()) {
          const dayOfWeek = temp.getDay();
          const dateISO = `${temp.getFullYear()}-${String(temp.getMonth()+1).padStart(2,'0')}-${String(temp.getDate()).padStart(2,'0')}`;
          
          const isWorkingDay = (dayOfWeek !== 0 && dayOfWeek !== 6) || (reportDatesSet && reportDatesSet.has(dateISO));
          if (isWorkingDay) {
            count++;
          }
          temp.setDate(temp.getDate() + 1);
        }
        return count;
      };

      // --- LÓGICA PUNTUACION (25% / 25% / 40% / 10%) ---
      const calcSalida = (hora) => {
        const min = timeToMinutes(hora);
        if(min===0) return null;
        const lim1 = timeToMinutes('08:20'); const lim2 = timeToMinutes('08:30');
        if(min <= lim1) return 10;
        if(min > lim2) return 0;
        return Math.max(0, 10 - ((min - lim1) * 0.5));
      };
      const calcEntrada = (hora) => {
        const min = timeToMinutes(hora);
        if(min===0) return null;
        const opt = timeToMinutes('17:50'); const lim = timeToMinutes('17:40');
        if(min >= opt) return 10;
        if(min < lim) return 0;
        return Math.max(0, 10 - ((opt - min) * 0.5));
      };
      const calcReportes = (reps) => {
        let val=0, sum=0;
        reps.forEach(r=>{if(!r||r==='NA')return; val++; const t=r.toUpperCase().trim(); if(t==='SI')sum+=1; else if(['FT','FF'].includes(t))sum+=0.5;});
        return val===0?10:sum*(10/val);
      };

      // --- COMPONENTE: SEARCHABLE SELECT ---
      const SearchableSelect = ({ options, value, onChange, placeholder }) => {

              <span className={`truncate ${!value ? 'text-slate-400' : 'text-slate-700'}`}>{value || placeholder || "Seleccionar..."}</span>
              <Icons.ChevronDown size={16} className="text-slate-400"/>
            </div>
            {isOpen && (

                  <div className="flex items-center bg-slate-50 rounded-lg px-2">
                    <Icons.Search size={14} className="text-slate-400"/>
                    <input type="text" className="w-full bg-transparent p-2 text-sm outline-none" placeholder="Buscar..." value={search} onChange={(e) => setSearch(e.target.value)} autoFocus />
                  </div>
                </div>
                <div className="overflow-y-auto custom-scrollbar flex-1">
                  <div className="px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm text-slate-600 font-bold" onClick={() => { onChange('Todos'); setIsOpen(false); }}>-- Todos --</div>
                  {filteredOptions.length > 0 ? (
                    filteredOptions.map(opt => (<div key={opt} className={`px-3 py-2 hover:bg-slate-50 cursor-pointer text-sm ${value === opt ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-600'}`} onClick={() => { onChange(opt); setIsOpen(false); }}>{opt}</div>))
                  ) : (<div className="px-3 py-4 text-center text-xs text-slate-400">No hay resultados</div>)}
                </div>
              </div>
            )}
          </div>
        );
      };

      // --- COMPONENTE: MULTI-SELECT AGRUPADO ---
      const MultiSelectGrouped = ({ allTechsInLogs, activeList, selected, onChange }) => {
        const [isOpen, setIsOpen] = useState(false);
        const ref = useRef(null);

        const activeTechNames = activeList.filter(t => t.estado === 'ACTIVO').map(t => t.nombre);
        const groupActive = allTechsInLogs.filter(t => activeTechNames.includes(t));
        const groupInactive = allTechsInLogs.filter(t => !activeTechNames.includes(t));

        useEffect(() => {
          const handleClickOutside = (event) => { if (ref.current && !ref.current.contains(event.target)) setIsOpen(false); };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        const toggleOption = (option) => {
          let newSelected;
          if (option === 'Todos') newSelected = ['Todos'];
          else {
            const current = selected.filter(s => s !== 'Todos');
            if (current.includes(option)) newSelected = current.filter(s => s !== option);
            else newSelected = [...current, option];
            if (newSelected.length === 0) newSelected = ['Todos'];
          }
          onChange(newSelected);
        };

        const displayValue = selected.includes('Todos') ? 'Todos los técnicos' : selected.length === 1 ? selected[0] : `${selected.length} seleccionados`;

        return (
          <div className="relative w-full" ref={ref}>
            <button onClick={() => setIsOpen(!isOpen)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-left flex justify-between items-center hover:border-indigo-300 transition focus:outline-none focus:ring-2 focus:ring-indigo-100">

      // --- APP PRINCIPAL ---
      function App() {

        const [ganttMode, setGanttMode] = useState('reducido');

        const [isProcessing, setIsProcessing] = useState(false);

        const showToast = (text, type = 'success') => { setMsg({ text, type }); setTimeout(() => setMsg(null), 4000); };

        const fetchEvaluacionData = () => {
          setLoadingEval(true);
          if (window.google && window.google.script) {
            window.google.script.run
              .withSuccessHandler(res => {
                 try { setListActivos(JSON.parse(res)); } catch(e){}
              })
              .withFailureHandler(err => {
                 showToast("⚠️ Error al obtener técnicos activos: " + (err.message || err), "error");
              })
              .getTecnicosActivos();

            window.google.script.run
              .withSuccessHandler(res => {
                const parsed = JSON.parse(res);
                if (parsed.length > 0) {
                  const cleanData = parsed.map(item => ({...item, fecha: normalizeDate(item.fecha)}));

                }
                setLoadingEval(false);
              })
              .withFailureHandler(err => {
                showToast("⚠️ Error al obtener Bitácora: " + (err.message || err), "error");
                setLoadingEval(false);
              })
              .getDataBitacora();
          } else {
            setTimeout(() => { setLoadingEval(false); }, 1000);
          }
        };

        useEffect(() => {
          fetchEvaluacionData();
          // Ocultar el loader y cancelar el timeout de diagnóstico cuando React monte exitosamente
          const loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';

        }, []);

        useEffect(() => {

                       setLoadingRepo(false);
                     })
                     .getDataReportes();
                } else { setLoadingRepo(false); }
             }
             if (dataMaestro.length === 0) {
                setLoadingMaestro(true);
                if (window.google && window.google.script) {
                   window.google.script.run
                     .withSuccessHandler(res => {
                       const parsed = JSON.parse(res);
                       if (parsed.length > 0) {
                          setDataMaestro(parsed);
                          showToast(`✅ Catálogo Maestro: ${parsed.length} proyectos cargados.`);
                       }
                       setLoadingMaestro(false);

                     .withFailureHandler(err => {
                       showToast("⚠️ Error al obtener Catálogo Maestro: " + (err.message || err), "error");
                       setLoadingMaestro(false);
                     })
                     .getBDProyectosMaestro();
                } else { setLoadingMaestro(false); }
             }
          }
        }, [activeTab]);

        const uniqueTechs = useMemo(() => ['Todos', ...new Set(dataEval.map(d=>d.nombre))].sort(), [dataEval]);
        const uniqueProjectsEval = useMemo(() => ['Todos', ...new Set(dataEval.map(d=>d.proyecto))].sort(), [dataEval]);
        const uniqueProjectsRepo = useMemo(() => {
          if (dataMaestro.length > 0) {
            const mappedOptions = dataMaestro.map(m => m.sap ? `[${m.sap}] ${m.proyecto}` : m.proyecto);
            const maestroProjNames = new Set(dataMaestro.map(m => m.proyecto.toUpperCase().trim()));
            dataRepo.forEach(r => {
              if (r.proyecto && !maestroProjNames.has(r.proyecto.toUpperCase().trim())) {
                mappedOptions.push(r.proyecto);
              }
            });
            return [...new Set(mappedOptions)].sort();
          }
          return [...new Set(dataRepo.map(d=>d.proyecto))].sort();
        }, [dataRepo, dataMaestro]);

        // --- MEMO EVALUACION ---
        const processedEval = useMemo(() => {
          const defaultReturn = { 
            processed: [], top3List: [], rawFilteredData: [], kpi: { scoreProj: 0, top: null, avgRep: 0 }, 
            charts: { am: [], pm: [] }, reports: [], avgs: { avgAM: 0, avgPM: 0 }, 
            siteStats: { lleg: '--:--', sal: '--:--', sitio: '--:--' }, 
            domains: { am: ['auto', 'auto'], pm: ['auto', 'auto'] }, filters: filtersEval 
          };

          if(!dataEval.length || !hasGeneratedEval) return defaultReturn;

          const searchVal = filtersEval.proj.toUpperCase().trim();
          const evalMaestroRec = dataMaestro.find(m => 
            String(m.proyecto).toUpperCase().trim() === searchVal ||
            String(m.sap).toUpperCase().trim() === searchVal
          );
          const evalProjName = evalMaestroRec ? evalMaestroRec.proyecto.toUpperCase().trim() : searchVal;
          const evalProjSap = evalMaestroRec ? evalMaestroRec.sap.toUpperCase().trim() : '';

          const filtered = dataEval.filter(r => {
            let p = true;
            if (filtersEval.proj !== 'Todos') {
              if (!r.proyecto) {
                p = false;
              } else {
                const logProj = r.proyecto.toUpperCase().trim();
                p = (logProj === evalProjName || (evalProjSap && logProj === evalProjSap));
              }
            }
            const t = filtersEval.tech.includes('Todos') || filtersEval.tech.includes(r.nombre);
            const d = filtersEval.proj!=='Todos' || (r.fecha >= filtersEval.start && r.fecha <= filtersEval.end);
            
            // EXCLUSIÓN DE PMI PARA JUSTICIA
            const notPMI = !r.nombre.toUpperCase().includes('PMI');
            return p && t && d && notPMI;
          });

          const groups = {}; 
          const repCounts = {'SI':0,'FT':0,'FF':0,'FT FF':0,'NO':0,'NA':0};
          
          filtered.forEach(r => {
             const rt = r.reporteEnv ? r.reporteEnv.toUpperCase().trim() : 'NA'; 
             if(repCounts[rt] !== undefined) repCounts[rt]++; 
             else if(rt === 'FT FF') repCounts['FT FF']++;

             if(!groups[r.nombre]) groups[r.nombre]={re:[], sal:0, salC:0, ent:0, entC:0, reps:[], par:0, reg:0, ret:0, fal:0, hS:0, hE:0, hC:0};
             const g=groups[r.nombre]; g.re.push(r);
             
             const sS=calcSalida(r.horaSalida); if(sS!==null){g.sal+=sS;g.salC++}
             const sE=calcEntrada(r.horaEntrada); if(sE!==null){g.ent+=sE;g.entC++}
             
             g.reps.push(r.reporteEnv);
             if(!['VACACIONES','PERMISO','INCAPACIDAD'].some(x=>(r.nota||'').toUpperCase().includes(x))) g.par+=(Number(r.tiempoParadas)||0);
             g.reg+=(Number(r.regresos)||0);
             const as=(r.asistencia||'').toUpperCase(); if(as==='RETARDO')g.ret++; if(as==='FALTA')g.fal++;
             if(r.horaSalProy && r.horaLlegProy && r.horaSalProy!=='00:00' && r.horaLlegProy!=='00:00') { g.hS+=timeToMinutes(r.horaLlegProy); g.hE+=timeToMinutes(r.horaSalProy); g.hC++; }
          });

                                               style={{ width: '35px', minWidth: '35px' }} 
                                               className={`border-r border-slate-100/70 h-full ${d.isWeekend ? 'bg-slate-200/20' : ''}`}
                                             />
                                           ))}
                                         </div>
                                         
                                         {ganttMode === 'reducido' ? (
                                           /* Barra del Gantt continua y absoluta para Vista Reducida */
                                           <div 
                                             className={`absolute bg-gradient-to-r ${task.isNoReportVirtual ? 'from-amber-400 to-amber-600 shadow-amber-100 border-amber-300 text-white' : (task.isDelayed ? 'from-red-500 to-rose-600 shadow-red-100 border-red-400 text-white' : 'from-indigo-500 to-violet-600 shadow-indigo-100 border-indigo-400 text-white')} h-5 rounded-md flex items-center justify-center shadow-sm select-none border border-white/20`}
                                             style={{ 
                                               left: `${task.left * 35}px`, 
                                               width: `${task.duration * 35}px` 
                                             }}
                                             title={`${task.name}: ${task.start} al ${task.end} (${task.workingDays} días laborados)`}
                                           >
                                             {task.workingDays >= 1 && (
                                               <span className="text-[8px] font-extrabold text-white opacity-90 drop-shadow-sm px-1 truncate font-sans">
                                                 {task.workingDays}d
                                               </span>
                                             )}
                                           </div>
                                         ) : (
                                           /* Barra del Gantt recortada y segmentada celda por celda para Vista Ampliada */
                                           <div className="absolute inset-0 flex items-center pointer-events-none">
                                             {ganttTimeline.days.map((d, i) => {
                                               const isActive = task.activeDates.has(d.dateISO);
                                               if (!isActive) return <div key={i} style={{ width: '35px', minWidth: '35px' }} className="h-full" />;
                                               
                                               const isPrevActive = i > 0 && task.activeDates.has(ganttTimeline.days[i-1].dateISO);
                                               const isNextActive = i < ganttTimeline.days.length - 1 && task.activeDates.has(ganttTimeline.days[i+1].dateISO);
                                               
                                               let roundedClass = 'rounded-md';
                                               if (isPrevActive && isNextActive) {
                                                 roundedClass = 'rounded-none';
                                               } else if (isPrevActive) {
                                                 roundedClass = 'rounded-r-md rounded-l-none';
                                               } else if (isNextActive) {
                                                 roundedClass = 'rounded-l-md rounded-r-none';
                                               }

                                               const bgClass = task.isNoReportVirtual
                                                 ? 'bg-gradient-to-r from-amber-400 to-amber-600 border-amber-300 text-white'
                                                 : (task.isDelayed 
                                                     ? 'bg-gradient-to-r from-red-500 to-rose-600 border-red-400 text-white' 
                                                     : 'bg-gradient-to-r from-indigo-500 to-violet-600 border-indigo-400 text-white');

                                               const isFirstActive = d.dateISO === task.start;

                                               return (
                                                 <div 
                                                   key={i} 
                                                   style={{ width: '35px', minWidth: '35px' }} 
                                                   className="h-full flex items-center justify-center relative pointer-events-auto"
                                                 >
                                                   <div 
                                                     className={`absolute inset-y-2.5 left-0 right-0 ${bgClass} ${roundedClass} flex items-center justify-center shadow-sm select-none border-t border-b`}
                                                     title={`${task.name}: ${d.dateISO} (${task.workingDays} días laborados)`}
                                                   >
                                                     {isFirstActive && (
                                                       <span className="text-[8px] font-extrabold text-white opacity-90 drop-shadow-sm px-0.5 truncate pointer-events-none">
                                                         {task.workingDays}d
                                                       </span>
                                                     )}
                                                   </div>
                                                 </div>
                                               );
                                             })}
                                           </div>
                                         )}
                                       </div>
                                     </div>
                                   );
                                 })}
                               </div>

                               {/* Línea de Deadline (Fecha Límite) */}
                               {ganttTimeline.deadlineIdx !== -1 && (
                                 <div 
                                   className="absolute top-0 bottom-0 border-l-2 border-red-500 border-dashed z-20 pointer-events-none"
                                   style={{ left: `${192 + ganttTimeline.deadlineIdx * 35}px` }}
                                   title={`Fecha Límite de Entrega: ${ganttTimeline.deadlineDateStr}`}
                                 >
                                   <span className="bg-red-500 text-white text-[8px] font-extrabold px-1.5 py-0.5 rounded absolute top-2 -left-4 shadow-md whitespace-nowrap">
                                     LÍMITE: {ganttTimeline.deadlineDateStr}
                                   </span>
                                 </div>
                               )}
                             </div>
                          </div>
                          <p className="text-[9px] text-slate-400 mt-2 italic text-right">
                            {ganttMode === 'reducido' 
                              ? 'Modo Reducido: Las columnas de fines de semana y pausas sin asistencia se han colapsado para ver la duración neta.' 
                              : 'Modo Ampliado: Se muestra el calendario natural continuo. Las barras se presentan cortadas (interrumpidas) en los días sin trabajo.'}
                          </p>
                        </div>
                      ) : (
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6 text-center text-slate-500">
                          <Icons.Calendar size={32} className="mx-auto mb-2 text-indigo-400 animate-pulse"/>
                          <h4 className="font-bold text-slate-700 text-sm">Cronograma no disponible</h4>
                          <p className="text-xs text-slate-400 max-w-md mx-auto mt-1 leading-relaxed">
                            No se encontraron actividades válidas o las fechas del reporte no pudieron ser procesadas para el diagrama de Gantt.
                          </p>
                          {processedRepo.length > 0 && (
                            <div className="mt-4 p-4 bg-slate-50 rounded-xl text-left text-xs font-mono text-slate-600 border border-slate-100 max-w-xl mx-auto overflow-x-auto">
                              <div className="font-bold text-[10px] text-indigo-500 uppercase tracking-wider mb-2 border-b border-indigo-100 pb-1">📂 Panel de Diagnóstico de Gantt</div>
                              <div className="grid grid-cols-2 gap-2 mb-2">
                                <div>Total de reportes: <span className="font-bold">{processedRepo.length}</span></div>
                                <div>Campos recibidos: <span className="font-bold text-slate-700">{JSON.stringify(Object.keys(processedRepo[0]))}</span></div>
                              </div>
                              <div className="mt-2 text-[10px] leading-relaxed bg-white p-2 rounded border border-slate-150">
                                <strong>Muestra del primer reporte:</strong>
                                <pre className="mt-1 whitespace-pre-wrap text-slate-500 text-[9px]">{JSON.stringify(processedRepo[0], null, 2)}</pre>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {/* PERSONAL Y PARTICIPACIÓN DE OBRA */}
                      {selectedRepoProjSap && (
                        <>
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6">
                          <h3 className="font-bold text-slate-700 flex gap-2 items-center text-sm mb-4">
                            <Icons.User size={16} className="text-indigo-500"/> Personal y Participación de Obra (Bitácora de Campo)
                          </h3>
                          {projectTechStats.length === 0 ? (
                            <div className="text-center py-6 text-slate-400 text-xs italic">No hay registros de personal en la Bitácora para este proyecto.</div>
                          ) : (
                            <div className="overflow-x-auto">
                              <table className="w-full text-xs text-left">
                                <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 font-bold border-b border-slate-200">
                                  <tr>
                                    <th className="px-4 py-2">Nombre Técnico</th>
                                    <th className="px-4 py-2">Rol Predominante</th>
                                    <th className="px-4 py-2 text-center">Asistencias</th>
                                    <th className="px-4 py-2 text-right">Participación</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {projectTechStats.map((t, i) => {
                                    const isLider = t.rol.toUpperCase().includes('LIDER') || t.rol.toUpperCase().includes('LÍDER');
                                    return (
                                      <tr key={i} className="hover:bg-slate-50/50">
                                        <td className="px-4 py-3 font-bold text-slate-700">{t.nombre}</td>
                                        <td className="px-4 py-3">
                                          <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold ${
                                            isLider ? 'bg-indigo-50 text-indigo-700 border border-indigo-150' : 'bg-slate-100 text-slate-650'
                                          }`}>
                                            {t.rol}
                                          </span>
                                        </td>
                                        <td className="px-4 py-3 text-center font-mono font-bold text-slate-600">{t.asistencias} días</td>
                                        <td className="px-4 py-3 text-right">
                                          <div className="flex items-center justify-end gap-2">
                                            <span className="font-mono font-bold text-slate-700">{t.porcentaje.toFixed(1)}%</span>
                                            <div className="w-16 bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                              <div className="bg-indigo-600 h-full" style={{ width: `${t.porcentaje}%` }}/>
                                            </div>
                                          </div>
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>

                        {/* BITACORA: REGISTROS FÍSICOS DE ASISTENCIA */}
                        {repoProjectRawLogs.length > 0 && (
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 print-avoid-break print-no-shadow">
                            <div className="flex justify-between items-center mb-4">
                              <h3 className="font-bold text-slate-700 flex gap-2 text-sm">
                                <Icons.Database size={18} className="text-teal-500"/>
                                Registros Físicos de Asistencia (Bitácora de Campo)
                              </h3>
                              <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
                                {repoProjectRawLogs.length} Registros
                              </span>
                            </div>
                            <div className="overflow-auto max-h-[350px] custom-scrollbar border border-slate-100 rounded-xl">
                              <table className="w-full text-xs text-left text-slate-650 min-w-[950px] relative border-collapse">
                                <thead className="bg-slate-50 text-[10px] uppercase text-slate-500 font-bold border-b border-slate-200 sticky top-0 z-10 shadow-[0_1px_0_rgba(0,0,0,0.05)]">
                                  <tr>
                                    <th className="px-3 py-2 pl-4">SAP</th>
                                    <th className="px-3 py-2">Fecha</th>
                                    <th className="px-3 py-2">Proyecto</th>
                                    <th className="px-3 py-2">Nombre</th>
                                    <th className="px-3 py-2">Rol</th>
                                    <th className="px-2 py-2 text-center">De</th>
                                    <th className="px-2 py-2 text-center">A</th>
                                    <th className="px-2 py-2 text-center">Cálculo Horas</th>
                                    <th className="px-3 py-2 text-center">Unidad</th>
                                    <th className="px-3 py-2 text-center">Reporte Env.</th>
                                    <th className="px-3 py-2 pl-2">Asunto</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {repoProjectRawLogs.map((log, i) => {
                                    const isLider = log.rol && (log.rol.toUpperCase().includes('LIDER') || log.rol.toUpperCase().includes('LÍDER'));
                                    const reportSent = log.reporteEnv ? String(log.reporteEnv).toUpperCase().trim() : '';
                                    const isReportOk = reportSent === 'SI';
                                    const isReportFt = reportSent === 'FT';
                                    const isReportFf = reportSent === 'FF';
                                    
                                    const liderClass = isLider ? 'bg-indigo-50 text-indigo-700 border border-indigo-150' : 'bg-slate-100 text-slate-650';
                                    
                                    let reportClass = 'bg-rose-50 text-rose-700 border border-rose-100';
                                    if (isReportOk) {
                                      reportClass = 'bg-emerald-50 text-emerald-700 border border-emerald-100';
                                    } else if (isReportFt || isReportFf) {
                                      reportClass = 'bg-amber-50 text-amber-700 border border-amber-100';
                                    }
                                    
                                    return (
                                      <tr key={i} className="hover:bg-slate-50/50">
                                        <td className="px-3 py-2.5 pl-4 font-mono font-bold text-slate-500">{log.sap || '-'}</td>
                                        <td className="px-3 py-2.5 font-bold text-slate-700 whitespace-nowrap">{log.fecha}</td>
                                        <td className="px-3 py-2.5 max-w-[180px] truncate" title={log.proyecto}>{log.proyecto}</td>
                                        <td className="px-3 py-2.5 font-bold text-slate-600">{log.nombre}</td>
                                        <td className="px-3 py-2.5">
                                          <span className={`px-2 py-0.5 rounded text-[9px] font-extrabold ${liderClass}`}>
                                            {log.rol || 'Apoyo'}
                                          </span>
                                        </td>
                                        <td className="px-2 py-2.5 text-center font-mono text-slate-500">{log.de || '-'}</td>
                                        <td className="px-2 py-2.5 text-center font-mono text-slate-500">{log.a || '-'}</td>
                                        <td className="px-2 py-2.5 text-center font-mono font-bold text-slate-600">{log.calculoHoras || '0'}</td>
                                        <td className="px-3 py-2.5 text-center font-bold text-teal-650 bg-teal-50/20">{log.unidad || '-'}</td>
                                        <td className="px-3 py-2.5 text-center">
                                          <span className={`px-2 py-0.5 rounded text-[9px] font-extrabold border ${reportClass}`}>
                                            {log.reporteEnv || 'NO'}
                                          </span>
                                        </td>
                                        <td className="px-3 py-2.5 max-w-[150px] truncate pl-2" title={log.asunto}>{log.asunto || '-'}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        )}
                      </>
                    )}

                      {/* SECCIÓN DE COMENTARIOS Y PENDIENTES */}
                      {selectedRepoProjSap && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                          {/* COMENTARIOS */}
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                            <h3 className="font-bold text-slate-700 flex gap-2 items-center text-sm mb-4">
                              <Icons.MessageSquare size={16} className="text-blue-500"/> Comentarios y Alertas del Proyecto
                            </h3>
                            {loadingCompend ? (
                              <div className="text-center py-10 text-slate-400 text-xs animate-pulse">Cargando comentarios...</div>
                            ) : dataComentarios.length === 0 ? (
                              <div className="text-center py-10 text-slate-400 text-xs italic">No hay comentarios registrados para este proyecto.</div>
                            ) : (
                              <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                {dataComentarios.map((c, i) => (
                                  <div key={i} className={`p-4 rounded-xl border ${c.prevencionYN === 'SI' ? 'bg-red-50/50 border-red-200' : 'bg-slate-50 border-slate-100'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                      <span className="text-[10px] font-bold text-slate-400 bg-white px-2 py-0.5 rounded shadow-sm flex items-center gap-1">
                                        <Icons.Calendar size={10}/> {c.fecha}
                                      </span>
                                      <span className={`text-[9px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider ${
                                        c.prevencionYN === 'SI' ? 'bg-red-100 text-red-700 animate-pulse' : 'bg-blue-100 text-blue-700'
                                      }`}>
                                        {c.prevencionYN === 'SI' ? '⚠️ Alerta' : 'Comentario'}
                                      </span>
                                    </div>
                                    <p className="text-xs font-bold text-slate-700 mb-1">{c.categoriaNegativo || 'General'}</p>
                                    <p className="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">{c.descripcion}</p>
                                    {c.prevencionYN === 'SI' && c.prevencionDescripcion && (
                                      <div className="mt-2 p-2.5 bg-white rounded-lg border border-red-150 text-[11px] text-red-700 font-medium">
                                        <strong>Acción de Prevención:</strong> {c.prevencionDescripcion}
                                      </div>
                                    )}
                                    <div className="mt-2 text-[9px] text-slate-400 font-medium text-right">— {c.responsable}</div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>

                          {/* PENDIENTES */}
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                            <h3 className="font-bold text-slate-700 flex gap-2 items-center text-sm mb-4">
                              <Icons.ListTodo size={16} className="text-emerald-500"/> Pendientes de Obra
                            </h3>
                            {loadingCompend ? (
                              <div className="text-center py-10 text-slate-400 text-xs animate-pulse">Cargando pendientes...</div>
                            ) : dataPendientes.length === 0 ? (
                              <div className="text-center py-10 text-slate-400 text-xs italic">No hay pendientes registrados para este proyecto.</div>
                            ) : (
                              <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                {dataPendientes.map((p, i) => (
                                  <div key={i} className="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                                    <div className="flex justify-between items-start mb-2 gap-2">
                                      <span className="text-[10px] font-bold text-slate-400 bg-white px-2 py-0.5 rounded shadow-sm flex items-center gap-1">
                                        <Icons.Calendar size={10}/> {p.fechaReporte}
                                      </span>
                                      <span className={`text-[9px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider ${
                                        (p.status||'').toUpperCase().includes('COMPLETO') || (p.status||'').toUpperCase().includes('CERRADO') || (p.status||'').toUpperCase().includes('CONCLUIDO')
                                          ? 'bg-green-100 text-green-700'
                                          : 'bg-amber-100 text-amber-700'
                                      }`}>
                                        {p.status || 'Pendiente'}
                                      </span>
                                    </div>
                                    <p className="text-xs font-bold text-indigo-600 mb-1">{p.titulo || 'Sin título'}</p>
                                    <p className="text-xs text-slate-600 leading-relaxed mb-2 whitespace-pre-wrap">{p.descripcion}</p>
                                    
                                    {p.razon && (
                                      <p className="text-[10px] text-slate-500 bg-white p-2 rounded border border-slate-100 mb-2">
                                        <strong>Razón:</strong> {p.razon}
                                      </p>
                                    )}
                                    
                                    <div className="flex justify-between items-center text-[9px] text-slate-400 font-medium">
                                      <span>Cat: {p.categoria || 'N/A'}</span>
                                      <span>Resp: <strong className="text-slate-500">{p.responsable}</strong> ({p.parteResponsable})</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      )}

                     {/* TIMELINE */}
                     {processedRepo.length === 0 ? (
                       <div className="p-10 text-center text-slate-400 bg-white rounded-xl border border-slate-100">No hay reportes para este proyecto.</div>
                     ) : (
                       <div className="relative border-l-2 border-slate-200 ml-4 space-y-8 pb-4 print-border-none print-ml-0">
                         {processedRepo.slice().reverse().map((report, idx) => (
                           <div key={idx} className="ml-6 relative print-ml-0 print-avoid-break mb-6">
                             <div className="absolute -left-[31px] top-0 bg-white border-2 border-indigo-500 w-4 h-4 rounded-full print-hidden"></div>
                             <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition print-no-shadow">
                               <div className="flex flex-col md:flex-row justify-between mb-4 border-b border-slate-50 pb-4 gap-4">
                                 <div>
                                   <div className="flex items-center gap-2 mb-1">
                                     <span className="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded flex items-center gap-1"><Icons.Calendar size={12}/> {report.fecha}</span>
                                   </div>
                                   <h3 className="font-bold text-indigo-600 text-sm flex items-center gap-1">📊 Avance Reportado</h3>
                                   <p className="text-xs text-slate-500">Personal en obra: {report.equipo || 'No especificado'}</p>
                                 </div>
                                 <div className="text-right flex flex-col items-end gap-2">
                                   <div className="flex gap-2 items-center">
                                     {report.linkPublico && (
                                       <a href={report.linkPublico} target="_blank" className="inline-flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold transition shadow-sm">
                                         📄 PDF Oficial
                                       </a>
                                     )}
                                     <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${
                                       (report.estatus||'').includes('Terminado') || (report.estatus||'').toUpperCase().includes('CONCLUIDO') ? 'bg-green-100 text-green-700' : 
                                       (report.estatus||'').includes('Proceso') || (report.estatus||'').toUpperCase().includes('PROCESO') ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'
                                     }`}>
                                       {report.estatus}
                                     </span>
                                   </div>
                                   {report.cantHorasExtra && report.cantHorasExtra !== '0' && (
                                     <div className="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded flex items-center justify-end gap-1">
                                       <Icons.AlertTriangle size={12}/> {report.cantHorasExtra} Hrs Extra
                                     </div>
                                   )}
                                 </div>
                               </div>
                               <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                 <div>
                                   <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1"><Icons.CheckSquare size={14}/> Actividades Realizadas</h4>
                                   <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{report.descripcion || 'Sin registro'}</p>
                                 </div>
                                 <div>
                                   <h4 className="text-xs font-bold text-red-400 uppercase mb-2 flex items-center gap-1"><Icons.AlertTriangle size={14}/> Pendientes / Observaciones</h4>
                                   <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100">
                                     {report.pendientes || 'Sin observaciones pendientes'}
                                   </p>
                                 </div>
                                 <div>
                                   <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-1"><Icons.Camera size={14}/> Evidencia Fotográfica</h4>
                                   <ImageGallery reportId={report.idReporte} isColumnLayout={true} />
                                 </div>
                               </div>
                             </div>
                           </div>
                         ))}
                       </div>
                     )}
                   </div>
                 )
            }
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
</html>
