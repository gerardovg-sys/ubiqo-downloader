name: Keepalive Workflow (Evitar Inactividad de GitHub Actions)

on:
  schedule:
    # Se ejecuta el día 1 y 15 de cada mes a las 00:00 UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Prevenir suspensión por 60 días
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Actualizar heartbeat de repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore(ci): keepalive heartbeat [skip ci]" || echo "No changes to commit"
          git push
