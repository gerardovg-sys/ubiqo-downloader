name: SMARTCORP Ubiqo Downloader

on:
  schedule:
    # Intento 1 (Madrugada principal): 02:23 AM hora de México / CST (08:23 UTC) de Martes a Sábado
    - cron: '23 8 * * 2-6'
    # Intento 2 (Rescate Matutino antes de oficina): 07:13 AM hora de México / CST (13:13 UTC) de Martes a Sábado
    - cron: '13 13 * * 2-6'
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Forzar descarga (ignorar candado de fecha ya procesada)'
        required: false
        default: false
        type: boolean
    # Permite ejecutar el flujo manualmente desde el panel de GitHub

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium

    - name: Run Ubiqo Downloader
      env:
        UBIQO_USER: ${{ secrets.UBIQO_USER }}
        UBIQO_PASS: ${{ secrets.UBIQO_PASS }}
        WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        WEB_APP_TOKEN: ${{ secrets.WEB_APP_TOKEN }}
        FORCE_DOWNLOAD: ${{ inputs.force_download || 'false' }}
        TZ: America/Mexico_City
      run: |
        python download_ubiqo.py

    - name: Archivar reporte Excel en GitHub Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-ubiqo-excel
        path: "*.xlsx"
        if-no-files-found: ignore
        retention-days: 30
