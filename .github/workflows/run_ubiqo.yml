name: SMARTCORP Ubiqo Downloader

on:
  schedule:
    # Intento 1: 02:15 AM hora de México / CST (08:15 UTC) de Martes a Sábado
    - cron: '15 8 * * 2-6'
    # Intento 2 (Rescate Matutino): 08:15 AM hora de México / CST (14:15 UTC) de Martes a Sábado
    - cron: '15 14 * * 2-6'
  workflow_dispatch:
    # Permite ejecutar el flujo manualmente desde el panel de GitHub

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium

    - name: Run Ubiqo Downloader
      env:
        UBIQO_USER: ${{ secrets.UBIQO_USER }}
        UBIQO_PASS: ${{ secrets.UBIQO_PASS }}
        WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        WEB_APP_TOKEN: ${{ secrets.WEB_APP_TOKEN }}
        TZ: America/Mexico_City
      run: |
        python download_ubiqo.py
